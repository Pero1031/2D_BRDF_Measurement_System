# recipe.toml - 測定の手順書
# ポーズ(左右アームの関節角, 度)、測定点(試料面の座標, mm)、撮影条件をここに書く。

[recipe]
name = "example"
operator = ""
description = "旧システムの最初の 3 ポーズによる、シミュレーション用のサンプル"
kind = "sample"   # "sample" | "white" | "calib"
# 測定前に人が確認する項目(brdf run が表示し、OK の入力を待つ)
checklist = [
    "分光放射輝度計のセッティング(ピント、位置調節)はしましたか",
    "カメラの位置を setup.toml に書き込みましたか",
    "台紙のセッティングはしましたか",
    "暗幕をたらし、暗室にしましたか",
]

[capture]
integration_time_ms = 100.0   # 0 = 装置が自動で決める(実機)
arm_speed = 0.5   # 0 より大きく 1 以下
wavelength_start = 380.0
wavelength_end = 780.0
wavelength_step = 1.0

# 測定点: 試料面の座標 (x, y) [mm]。紙の座標系(原点 = 試料面の基準点)
# [spot_grid] で格子状に指定することもできる:
#   [spot_grid]
#   center = [0.0, 0.0]
#   step = [10.0, 10.0]
#   count = [5, 5]

[[spots]]
id = 1
x = -20.0
y = -20.0

[[spots]]
id = 2
x = 0.0
y = -20.0

[[spots]]
id = 3
x = 20.0
y = -20.0

[[spots]]
id = 4
x = -20.0
y = 0.0

[[spots]]
id = 5
x = 0.0
y = 0.0

[[spots]]
id = 6
x = 20.0
y = 0.0

[[spots]]
id = 7
x = -20.0
y = 20.0

[[spots]]
id = 8
x = 0.0
y = 20.0

[[spots]]
id = 9
x = 20.0
y = 20.0

# ポーズ: left = 左アーム(光源側)、right = 右アーム(試料側)。J1〜J6 の順、度

[[poses]]
id = "1"
left = [45.0, 0.0, 90.0, 0.0, 0.0, -30.0]
right = [-45.0, 0.0, 90.0, 0.0, 0.0, 0.0]

[[poses]]
id = "2"
left = [45.0, 0.0, 90.0, 0.0, 0.0, -25.0]
right = [-45.0, 0.0, 90.0, 0.0, 0.0, 0.0]

[[poses]]
id = "3"
left = [45.0, 0.0, 90.0, 0.0, 0.0, -20.0]
right = [-45.0, 0.0, 90.0, 0.0, 0.0, 0.0]
